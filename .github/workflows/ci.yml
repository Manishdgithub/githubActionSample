name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Code Quality & Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Ruff Linter Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Bandit Security SAST Scan
        run: bandit -r src/ -ll

      - name: Dependency Vulnerability Audit
        run: pip-audit

  backend-tests:
    name: Backend API & Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest with Coverage & Contract Verification
        env:
          DATABASE_URL: postgresql://appuser:secretpassword@localhost:5432/appdb
          JWT_SECRET_KEY: test-secret-key-32-bytes-minimum-jwt
        run: |
          pytest --cov=enterprise_hub --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  e2e-and-ui-tests:
    name: Frontend UI & E2E Behavior Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Linter & Unit Tests
        working-directory: frontend
        run: |
          npm run lint
          npm test -- --run

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  performance-smoke-test:
    name: Performance & Latency Smoke Test (k6)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & run app background server
        env:
          JWT_SECRET_KEY: test-secret-key-32-bytes-minimum-jwt
          DATABASE_URL: sqlite:///./perf_test.db
        run: |
          python -m pip install -e .
          python -m enterprise_hub.app &
          sleep 3

      - name: Run k6 Performance Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/perf/load_smoke_test.js

  container-build-and-scan:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [code-quality-and-security, backend-tests, e2e-and-ui-tests]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: enterprise-hub:ci-${{ github.sha }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-hub:ci-${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
