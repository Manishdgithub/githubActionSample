name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Static Analysis, Quality & Dependency Vulnerability Audits
  code-quality-and-security:
    name: Code Quality & Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Quality & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Ruff Linter Check
        run: python -m ruff check .

      - name: Ruff Format Check
        run: python -m ruff format --check .

      - name: Bandit SAST Security Scan
        run: bandit -r src/ -ll

      - name: Dependency Vulnerability Audit
        run: pip-audit

  # 2. Functional, Integration & Contract Testing with PostgreSQL Service
  backend-tests:
    name: Backend API & Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest with Coverage & API Verification
        env:
          DATABASE_URL: postgresql://appuser:secretpassword@localhost:5432/appdb
          JWT_SECRET_KEY: test-secret-key-32-bytes-minimum-jwt
        run: |
          pytest --cov=enterprise_hub --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml

  # 3. Frontend Lint, Unit, and Playwright E2E Browser Testing
  e2e-and-ui-tests:
    name: Frontend UI & E2E Behavior Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install
          chmod -R +x node_modules/.bin

      - name: Frontend Linter & Unit Tests
        working-directory: frontend
        run: |
          npm run lint
          npm test -- --run

      - name: Install Playwright Chromium Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/

  # 4. Automated Performance & Latency Smoke Test (k6)
  performance-smoke-test:
    name: Performance & Latency Smoke Test (k6)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup k6 CLI natively
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start Application & Run k6
        env:
          JWT_SECRET_KEY: test-secret-key-32-bytes-minimum-jwt
          DATABASE_URL: sqlite:///./perf_test.db
        run: |
          python -m pip install -e .
          
          # 1. Start server as a background process and save PID
          python -m enterprise_hub.app &
          SERVER_PID=$!

          # 2. Wait up to 15 seconds until /healthz responds
          echo "Waiting for FastAPI server to be healthy..."
          timeout 15 bash -c 'until curl -s http://127.0.0.1:8000/healthz; do sleep 1; done'

          # 3. Execute k6 load test natively
          k6 run tests/perf/load_smoke_test.js

          # 4. Clean up background process
          kill $SERVER_PID

  # 5. Build, Vulnerability Scan (Trivy), and Publish to GHCR
  build-scan-and-push:
    name: Build, Scan & Push Docker Image
    needs: [code-quality-and-security, backend-tests, e2e-and-ui-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: repo_name
        shell: bash
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image Locally (for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: enterprise-hub:ci-${{ github.sha }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-hub:ci-${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Docker Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.image_name }}:latest
            ghcr.io/${{ steps.repo_name.outputs.image_name }}:${{ github.sha }}